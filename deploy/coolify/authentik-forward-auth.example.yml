# Example Coolify/Traefik dynamic configuration for ETF enterprise.
# Replace <AUTHENTIK_INTERNAL_HOST> with the Authentik server/outpost hostname
# reachable on the shared Coolify proxy network.
#
# Install as a Coolify Proxy -> Dynamic Configuration and attach
# etf-authentik@file to the HTTPS router for the enterprise ETF domain.

http:
  middlewares:
    etf-authentik:
      forwardAuth:
        address: "http://<AUTHENTIK_INTERNAL_HOST>:9000/outpost.goauthentik.io/auth/traefik"
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-entitlements
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
          - X-authentik-meta-outpost
          - X-authentik-meta-provider
          - X-authentik-meta-app
          - X-authentik-meta-version
