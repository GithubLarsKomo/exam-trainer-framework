name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run test
      - run: npm run test:server
      - run: npm run catalog:enterprise:verify
      - run: npm run build
      - name: Verify generated hosted catalog releases
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/catalogs/registry.json
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const registry = JSON.parse(fs.readFileSync('dist/catalogs/registry.json', 'utf8'));
          if (registry.schemaVersion !== 1 || !Array.isArray(registry.catalogs)) throw new Error('Unexpected hosted registry.');
          const expected = new Map([
            ['fuegetechnik', '0.5.10'],
          ]);
          if (registry.catalogs.length !== expected.size) throw new Error(`Expected ${expected.size} hosted catalogs, got ${registry.catalogs.length}.`);
          for (const entry of registry.catalogs) {
            const expectedVersion = expected.get(entry.id);
            if (!expectedVersion || entry.version !== expectedVersion || entry.status !== 'released') {
              throw new Error(`Unexpected hosted release identity: ${entry.id}@${entry.version}.`);
            }
            const relative = entry.catalogUrl.replace(/^\.\//, '');
            const file = path.join('dist', 'catalogs', relative);
            if (!fs.existsSync(file)) throw new Error(`Missing generated hosted catalog: ${file}`);
            const bytes = fs.readFileSync(file);
            const actual = `sha256:${crypto.createHash('sha256').update(bytes).digest('hex')}`;
            if (entry.contentHash !== actual) throw new Error(`Hosted catalog hash does not match generated bytes for ${entry.id}.`);
            const bundle = JSON.parse(bytes.toString('utf8'));
            if (
              bundle.format !== 'etf-catalog'
              || bundle.version !== 1
              || bundle.catalog?.catalogId !== entry.id
              || bundle.catalog?.version !== entry.version
            ) throw new Error(`Hosted catalog bundle identity mismatch for ${entry.id}.`);
          }
          for (const [id, version] of expected) {
            if (!registry.catalogs.some(entry => entry.id === id && entry.version === version)) {
              throw new Error(`Missing expected hosted release ${id}@${version}.`);
            }
          }
          NODE
      - name: Verify generic build has no enterprise-private content
        shell: bash
        run: |
          set -euo pipefail
          test ! -e dist/private-catalogs
          if grep -R -q --binary-files=without-match 'enterprise-leadership-n1' dist; then
            echo "Confidential enterprise catalog identity leaked into generic dist."
            exit 1
          fi
          if grep -R -q --binary-files=without-match 'Unternehmen mitführen – Leadership Trainer' dist; then
            echo "Confidential enterprise catalog title leaked into generic dist."
            exit 1
          fi
          node - <<'NODE'
          const profile = JSON.parse(require('node:fs').readFileSync('dist/deployment-profile.json', 'utf8'));
          if (profile.id !== 'generic' || profile.kind !== 'generic' || profile.privateCatalogs?.length) {
            throw new Error('Generic deployment profile is not clean.');
          }
          NODE
      - name: Verify enterprise white-label build
        shell: bash
        run: |
          set -euo pipefail
          npm run build:enterprise
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const profile = JSON.parse(fs.readFileSync('dist/deployment-profile.json', 'utf8'));
          if (profile.id !== 'enterprise-euroimmun' || profile.kind !== 'enterprise') throw new Error('Wrong enterprise profile identity.');
          if (profile.branding?.productName !== 'Euroimmun Learning') throw new Error('Enterprise branding missing.');
          if (profile.catalogPolicy?.publicRegistry !== false) throw new Error('Enterprise profile must disable public registry.');
          if (
            profile.access?.mode !== 'pending-proxy'
            || profile.access?.proxyAuthorizationRequired !== true
            || profile.access?.productionReady !== false
          ) {
            throw new Error('Enterprise implementation build must remain fail-closed until the auth proxy is configured.');
          }
          const entry = profile.privateCatalogs?.find(x => x.id === 'enterprise-leadership-n1' && x.version === '0.3.0');
          if (!entry) throw new Error('Private enterprise catalog missing.');
          const file = path.join('dist', entry.catalogUrl.replace(/^\.\//, ''));
          const bytes = fs.readFileSync(file);
          const actual = `sha256:${crypto.createHash('sha256').update(bytes).digest('hex')}`;
          if (actual !== entry.contentHash) throw new Error('Private enterprise catalog hash mismatch.');
          if (entry.contentHash !== 'sha256:a7b8a45f307be0024472b1fd85b62db9aea9b7fb363e029fbb3de24a0e9c26ee') {
            throw new Error('Private enterprise catalog is not byte-identical to the canonical released source.');
          }
          const bundle = JSON.parse(bytes.toString('utf8'));
          if (bundle.catalog?.catalogId !== entry.id || bundle.catalog?.version !== entry.version) throw new Error('Private catalog identity mismatch.');
          const registry = JSON.parse(fs.readFileSync('dist/catalogs/registry.json', 'utf8'));
          if (registry.catalogs.some(x => x.id === 'enterprise-leadership-n1')) throw new Error('Enterprise catalog must not appear in public registry.');
          const manifest = JSON.parse(fs.readFileSync('dist/manifest.webmanifest', 'utf8'));
          if (manifest.name !== 'Euroimmun Learning') throw new Error('Enterprise PWA manifest branding missing.');
          NODE
      - name: Verify self-hosted reverse-proxy release build
        shell: bash
        run: |
          set -euo pipefail
          npm run build:enterprise:release
          node - <<'NODE'
          const fs = require('node:fs');
          const profile = JSON.parse(fs.readFileSync('dist/deployment-profile.json', 'utf8'));
          if (
            profile.access?.mode !== 'proxy'
            || profile.access?.proxyAuthorizationRequired !== true
            || profile.access?.productionReady !== true
          ) {
            throw new Error('Enterprise release profile is not reverse-proxy ready.');
          }
          if (fs.existsSync('dist/staticwebapp.config.json')) {
            throw new Error('Azure Static Web Apps configuration must not be generated.');
          }
          NODE

  production-container:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t exam-trainer-framework:ci .
      - name: Start production image
        run: docker run -d --name etf-ci -p 3000:3000 exam-trainer-framework:ci
      - name: Verify health, app shell and hosted catalog registry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/healthz >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs etf-ci
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/ | grep -q '<div id="app"></div>'
          curl --fail --silent --head http://127.0.0.1:3000/healthz | grep -qi 'cache-control: no-store'
          curl --fail --silent http://127.0.0.1:3000/catalogs/registry.json --output /tmp/registry.json
          curl --fail --silent http://127.0.0.1:3000/catalogs/fuegetechnik/0.5.10.json --output /tmp/fuegetechnik-0.5.10.json
          grep -q '"fuegetechnik"' /tmp/registry.json
          if grep -q '"enterprise-leadership-n1"' /tmp/registry.json; then
            echo "Confidential enterprise catalog leaked into public registry."
            exit 1
          fi
          grep -q '"format": "etf-catalog"' /tmp/fuegetechnik-0.5.10.json
      - name: Show container logs on failure
        if: failure()
        run: docker logs etf-ci || true
      - name: Stop production image
        if: always()
        run: docker rm -f etf-ci || true

  browser-acceptance:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: webkit
            browser: webkit
          - project: mobile-webkit
            browser: webkit
    name: browser-${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browser }}-${{ hashFiles('package.json') }}
      - name: Install browser system dependencies
        timeout-minutes: 10
        run: npx playwright install-deps ${{ matrix.browser }}
      - name: Install Playwright browser
        run: npx playwright install ${{ matrix.browser }}
      - name: Run browser acceptance suite
        run: npm run test:e2e -- --project=${{ matrix.project }}
      - name: Run production PWA smoke
        if: matrix.project == 'chromium'
        run: npm run test:prod-smoke
      - name: Build enterprise implementation profile
        if: matrix.project == 'chromium'
        run: npm run build:enterprise
      - name: Run enterprise profile browser acceptance
        if: matrix.project == 'chromium'
        run: npm run test:e2e:enterprise
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
            test-results-prod/
            test-results-enterprise/
          if-no-files-found: ignore
          retention-days: 14


  enterprise-container:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build enterprise release image
        run: |
          docker build             --build-arg ETF_DEPLOYMENT_PROFILE=enterprise-euroimmun             --build-arg ETF_ENTERPRISE_RELEASE=1             -t exam-trainer-framework:enterprise-ci .
      - name: Start enterprise release image behind simulated trusted proxy
        run: |
          docker run -d --name etf-enterprise-ci             -e ETF_TRUST_AUTH_PROXY=1             -p 3001:3000             exam-trainer-framework:enterprise-ci
      - name: Verify enterprise runtime and trusted Authentik identity endpoint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/healthz >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs etf-enterprise-ci
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3001/deployment-profile.json --output /tmp/enterprise-profile.json
          grep -q '"mode": "proxy"' /tmp/enterprise-profile.json
          grep -q '"productionReady": true' /tmp/enterprise-profile.json
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/auth/user)" = "401"
          curl --fail --silent -H 'X-authentik-uid: ci-user-123' -H 'X-authentik-email: ci@example.invalid' -H 'X-authentik-name: CI User' http://127.0.0.1:3001/auth/user --output /tmp/auth-user.json
          grep -q '"userId":"ci-user-123"' /tmp/auth-user.json
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/private-catalogs/enterprise-leadership-n1/0.3.0.json)" = "401"
          curl --fail --silent -H 'X-authentik-uid: ci-user-123' http://127.0.0.1:3001/private-catalogs/enterprise-leadership-n1/0.3.0.json --output /tmp/private-catalog.json
          grep -q '"enterprise-leadership-n1"' /tmp/private-catalog.json
      - name: Show enterprise container logs on failure
        if: failure()
        run: docker logs etf-enterprise-ci || true
      - name: Stop enterprise image
        if: always()
        run: docker rm -f etf-enterprise-ci || true
