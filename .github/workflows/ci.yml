name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run test
      - run: npm run test:server
      - run: npm run build
      - name: Verify generated hosted catalog releases
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/catalogs/registry.json
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const registry = JSON.parse(fs.readFileSync('dist/catalogs/registry.json', 'utf8'));
          if (registry.schemaVersion !== 1 || !Array.isArray(registry.catalogs)) throw new Error('Unexpected hosted registry.');
          const expected = new Map([
            ['enterprise-leadership-n1', '0.3.0'],
            ['fuegetechnik', '0.5.10'],
          ]);
          if (registry.catalogs.length !== expected.size) throw new Error(`Expected ${expected.size} hosted catalogs, got ${registry.catalogs.length}.`);
          for (const entry of registry.catalogs) {
            const expectedVersion = expected.get(entry.id);
            if (!expectedVersion || entry.version !== expectedVersion || entry.status !== 'released') {
              throw new Error(`Unexpected hosted release identity: ${entry.id}@${entry.version}.`);
            }
            const relative = entry.catalogUrl.replace(/^\.\//, '');
            const file = path.join('dist', 'catalogs', relative);
            if (!fs.existsSync(file)) throw new Error(`Missing generated hosted catalog: ${file}`);
            const bytes = fs.readFileSync(file);
            const actual = `sha256:${crypto.createHash('sha256').update(bytes).digest('hex')}`;
            if (entry.contentHash !== actual) throw new Error(`Hosted catalog hash does not match generated bytes for ${entry.id}.`);
            const bundle = JSON.parse(bytes.toString('utf8'));
            if (
              bundle.format !== 'etf-catalog'
              || bundle.version !== 1
              || bundle.catalog?.catalogId !== entry.id
              || bundle.catalog?.version !== entry.version
            ) throw new Error(`Hosted catalog bundle identity mismatch for ${entry.id}.`);
          }
          for (const [id, version] of expected) {
            if (!registry.catalogs.some(entry => entry.id === id && entry.version === version)) {
              throw new Error(`Missing expected hosted release ${id}@${version}.`);
            }
          }
          NODE

  production-container:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t exam-trainer-framework:ci .
      - name: Start production image
        run: docker run -d --name etf-ci -p 3000:3000 exam-trainer-framework:ci
      - name: Verify health, app shell and hosted catalog registry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/healthz >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs etf-ci
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/ | grep -q '<div id="app"></div>'
          curl --fail --silent --head http://127.0.0.1:3000/healthz | grep -qi 'cache-control: no-store'
          curl --fail --silent http://127.0.0.1:3000/catalogs/registry.json --output /tmp/registry.json
          curl --fail --silent http://127.0.0.1:3000/catalogs/fuegetechnik/0.5.10.json --output /tmp/fuegetechnik-0.5.10.json
          curl --fail --silent http://127.0.0.1:3000/catalogs/enterprise-leadership-n1/0.3.0.json --output /tmp/enterprise-leadership-n1-0.3.0.json
          grep -q '"fuegetechnik"' /tmp/registry.json
          grep -q '"enterprise-leadership-n1"' /tmp/registry.json
          grep -q '"format": "etf-catalog"' /tmp/fuegetechnik-0.5.10.json
          grep -q '"format": "etf-catalog"' /tmp/enterprise-leadership-n1-0.3.0.json
      - name: Show container logs on failure
        if: failure()
        run: docker logs etf-ci || true
      - name: Stop production image
        if: always()
        run: docker rm -f etf-ci || true

  browser-acceptance:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: webkit
            browser: webkit
          - project: mobile-webkit
            browser: webkit
    name: browser-${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browser }}-${{ hashFiles('package.json') }}
      - name: Install browser system dependencies
        timeout-minutes: 10
        run: npx playwright install-deps ${{ matrix.browser }}
      - name: Install Playwright browser
        run: npx playwright install ${{ matrix.browser }}
      - name: Run browser acceptance suite
        run: npm run test:e2e -- --project=${{ matrix.project }}
      - name: Run production PWA smoke
        if: matrix.project == 'chromium'
        run: npm run test:prod-smoke
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
            test-results-prod/
          if-no-files-found: ignore
          retention-days: 14
