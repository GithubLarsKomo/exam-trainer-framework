name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run test
      - run: npm run test:server
      - run: npm run build

  production-container:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t exam-trainer-framework:ci .
      - name: Start production image
        run: docker run -d --name etf-ci -p 3000:3000 exam-trainer-framework:ci
      - name: Verify health and app shell
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/healthz >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs etf-ci
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/ | grep -q '<div id="app"></div>'
          curl --fail --silent --head http://127.0.0.1:3000/healthz | grep -qi 'cache-control: no-store'
      - name: Show container logs on failure
        if: failure()
        run: docker logs etf-ci || true
      - name: Stop production image
        if: always()
        run: docker rm -f etf-ci || true

  browser-acceptance:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: webkit
            browser: webkit
          - project: mobile-webkit
            browser: webkit
    name: browser-${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browser }}-${{ hashFiles('package.json') }}
      - name: Install browser system dependencies
        timeout-minutes: 10
        run: npx playwright install-deps ${{ matrix.browser }}
      - name: Install Playwright browser
        run: npx playwright install ${{ matrix.browser }}
      - name: Run browser acceptance suite
        run: npm run test:e2e -- --project=${{ matrix.project }}
      - name: Run production PWA smoke
        if: matrix.project == 'chromium'
        run: npm run test:prod-smoke
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
            test-results-prod/
          if-no-files-found: ignore
          retention-days: 14
